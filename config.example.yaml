# Minimal, provider-neutral CLIProxyAPI runtime reference for AIProxyHub.
#
# AIProxyHub normally generates this file in a private temporary directory;
# this example is documentation only. Never put real provider credentials,
# refresh tokens, cookies, or private endpoints in this repository.
# Configure only credentials and providers that you are authorized to use,
# following the provider's own documented authentication flow.

host: "127.0.0.1"
port: 8317

remote-management:
  allow-remote: false
  secret-key: "replace-with-a-strong-local-management-secret"
  disable-control-panel: true

auth-dir: "~/.cli-proxy-api"

api-keys:
  - "replace-with-a-random-client-key"

debug: false
usage-statistics-enabled: true
proxy-url: ""
request-retry: 3
max-retry-credentials: 3

# Fixed by policy: AIProxyHub does not switch projects or model classes to
# work around an upstream usage limit.
quota-exceeded:
  switch-project: false
  switch-preview-model: false

routing:
  strategy: "round-robin"
