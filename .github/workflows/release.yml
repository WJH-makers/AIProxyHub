name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate source before release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 署名守卫要扫完整分支历史；默认浅克隆会让它静默放行。
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      # 下面的合规守卫用 rg，ubuntu runner 不预装它。
      # 缺失时 rg 以 127 退出，守卫看起来"失败"但其实根本没跑。
      - name: Install ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep
          rg --version
      - name: Run quality gates
        run: |
          python -m ruff check launcher.py launcher_monitor.py launcher_security.py launcher_settings.py --select E9,F821,F823,F811,F841
          python -m compileall -q launcher.py launcher_monitor.py launcher_security.py launcher_settings.py tests
          python -m pytest -q

      - name: Confirm removed registration workflow stays absent
        run: |
          test -z "$(git ls-files | grep -E '(^|/)(register|chatgpt_register|protocol_keygen)' || true)"
          if rg -n -i --glob '*.py' --glob '*.ps1' --glob '*.bat' --glob '*.cmd' --glob '!smoke-release-exe.py' \
            'duckmail\.sbs|openai-sentinel-token|sentinel\.openai|email-otp|AIPROXYHUB_REGISTER|register-worker|register/chatgpt_register|protocol_keygen' .; then
            echo "removed account-registration workflow found"
            exit 1
          fi

      - name: Keep maintainer attribution explicit
        run: |
          if rg -n -i --hidden --glob '!.git/**' --glob '!*.yml' --glob '!*.yaml' --glob '!*.exe' --glob '!*.zip' \
            'co-authored-by:.*(claude|anthropic)|generated by claude|claude-assisted|claude署名' .; then
            echo "unapproved Claude attribution found"
            exit 1
          fi
          # 扫完整分支历史而非固定的最近 N 条：固定窗口会随历史增长静默失效。
          if git log HEAD --format=%B | rg -n -i 'co-authored-by:.*(claude|anthropic)|generated by claude|claude-assisted|claude署名'; then
            echo "unapproved Claude attribution found in recent history"
            exit 1
          fi

      - name: Confirm gateway limits stay wired to the request path
        run: |
          rg -q '_ratelimit_check' launcher.py
          rg -q '_concurrency_acquire' launcher.py
          rg -q 'def _dispatch' launcher.py
          test "$(rg -c 'self\._dispatch\(\)' launcher.py)" = "5"
          test -z "$(rg -n 'def do_(GET|POST|PUT|PATCH|DELETE)\(self\):\s*$' -A 1 launcher.py | rg 'self\._handle\(\)' || true)"
          python -c "import launcher; d = launcher.default_settings(); assert d['gateway_rate_limit_rpm'] > 0; assert d['gateway_max_concurrent_requests'] > 0"

      - name: Scan source for obvious secrets
        run: |
          if rg -n --hidden --glob '!.git/**' --glob '!*.md' --glob '!*.yml' --glob '!*.yaml' \
            --glob '*.py' --glob '*.ps1' --glob '*.bat' --glob '*.cmd' --glob '*.toml' --glob '*.ini' --glob '*.json' \
            'BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|sk-[A-Za-z0-9]{24,}|gh[pousr]_[A-Za-z0-9]{20,}' .; then
            echo "possible secret pattern found"
            exit 1
          fi

  package:
    name: Build verified Windows package
    runs-on: windows-latest
    needs: validate
    permissions:
      contents: read
    env:
      CLIPROXYAPI_TAG: v7.2.129
      CLIPROXYAPI_SHA256: 45192C808339F17778574616FBDBAD8BB1FA1239AD4EFF90E87C221B4DDE50FE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Create build environment
        shell: pwsh
        run: python -m venv .venv

      - name: Install and verify CLIProxyAPI
        shell: pwsh
        run: |
          .\scripts\get-cliproxyapi.ps1 -Tag $env:CLIPROXYAPI_TAG -ExpectedSha256 $env:CLIPROXYAPI_SHA256

      - name: Build release package
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aiproxyhub-windows-release
          path: release/*
          if-no-files-found: error

  gh_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows release artifacts
        uses: actions/download-artifact@v4
        with:
          name: aiproxyhub-windows-release
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
