name: Bug 报告
description: 报告可复现的缺陷
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请勿粘贴真实 API Key、provider token、账号密码或私有 prompt/response。
        安全漏洞请走私有 Security Advisory，不要开公开 Issue。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 管理面板右上角的版本号，或 `AIProxyHub.exe --version` 的输出
      placeholder: 2.0.0-clean
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 运行方式
      options:
        - EXE 发布包
        - 安装包
        - 源码 (python launcher.py)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 26100
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 请给出最小复现路径；涉及上游 provider 时说明是哪一类配置，不要贴凭据。
      placeholder: |
        1. 启用透明网关与缓存
        2. 用 Codex CLI 发起 /v1/responses 请求
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为与实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志片段（可选）
      description: 面板日志已做基础脱敏，粘贴前请再自行确认没有残留密钥。
      render: text
  - type: checkboxes
    id: scope
    attributes:
      label: 确认
      options:
        - label: 我没有在本 Issue 中包含任何真实凭据、token 或私有 prompt 内容
          required: true
        - label: 这不是关于账号批量注册、验证码收取、反滥用绕过或规避 provider 限额的请求
          required: true
